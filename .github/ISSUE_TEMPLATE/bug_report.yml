name: Bug report
description: Report a reproducible PayCal defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, customer data, payroll data, private worker records, or vulnerability details. Report suspected vulnerabilities privately to security@paycal.app.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: A concise description of the defect.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Worker calendar or earnings
        - Business workspace
        - Reports or exports
        - Authentication or account settings
        - Billing or Stripe
        - Accessibility
        - Developer tooling
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide exact steps using fake/local data.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, PHP version, Node version, Redis state, local/prod, and relevant feature flags.
      placeholder: |
        Browser:
        OS:
        PHP:
        Node:
        Redis:
        Environment:
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Redact personal data, pay data, tokens, API keys, cookies, and account identifiers.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I did not include secrets, production customer data, payroll data, private worker records, or vulnerability details.
          required: true
