name: Policy Meta

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  policy-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Run local policy meta checks
        run: bash scripts/hooks/check-policy-meta.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f  # v2
        with:
          php-version: "8.5"
          coverage: none

      - name: Composer audit
        run: |
          composer install --no-interaction --no-progress --prefer-dist --no-dev 2>/dev/null || composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: npm

      - name: npm audit
        run: |
          npm ci
          npm audit --audit-level=high
