name: Policy Meta

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  policy-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Run local policy meta checks
        run: bash scripts/hooks/check-policy-meta.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f  # v2
        with:
          php-version: "8.5"
          coverage: none

      - name: Composer audit
        run: |
          composer install --no-interaction --no-progress --prefer-dist --no-dev 2>/dev/null || composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: npm

      - name: npm audit
        run: |
          npm ci
          npm audit --audit-level=high
