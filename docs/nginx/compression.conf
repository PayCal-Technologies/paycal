# PayCal response compression (nginx)
#
# Apply on production/mac hosts inside the server {} block (http context is fine too).
# Lighthouse flags HTML/CSS/JS without Content-Encoding when this is missing.
#
# Deploy (mac / production):
#   1. sudo cp docs/nginx/compression.conf /etc/nginx/snippets/paycal-compression.conf
#   2. Add inside the paycal server {} block: include snippets/paycal-compression.conf;
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. Verify:
#        curl -sI -H 'Accept-Encoding: gzip' https://mac.paycal.app/auth/ | grep -i content-encoding
#      Expected: Content-Encoding: gzip
#
# PHP: keep zlib.output_compression = Off in php.ini / php-fpm pool when nginx gzip is enabled
# (avoids double compression). ws/index.php already disables zlib for SSE streams.
#
# Vary: Cookie on user-specific CSS/JS bundles is compatible with gzip_vary on; caches key
# separately per Accept-Encoding and Cookie.

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_disable "msie6";

# text/html (PHP pages), text/css (/css/*/index.php), application/javascript (/js bundles + static .js),
# JSON API payloads. Skip images/fonts — already compressed binary formats.
gzip_types
    text/plain
    text/css
    text/html
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml;

# Optional — only when ngx_brotli is compiled/installed (not in stock nginx packages):
# brotli on;
# brotli_comp_level 5;
# brotli_min_length 256;
# brotli_types text/plain text/css text/html text/xml application/json application/javascript application/xml application/xml+rss image/svg+xml;
