# PayCal SEO endpoints — dynamic robots.txt and sitemap.xml (environment-aware PHP).
#
# Install:
#   cp docs/nginx/seo-endpoints.conf /etc/nginx/snippets/paycal-seo-endpoints.conf
#   # inside each paycal server {} (paycal.app, dev.paycal.app, mac.paycal.app):
#   include snippets/paycal-seo-endpoints.conf;
#
# robots.php returns block-all on dev/mac hosts and production policy on paycal.app.
# Remove html/robots.txt static file if present — PHP handler replaces it.

location = /robots.txt {
    include fastcgi_params;
    fastcgi_pass php;
    fastcgi_param SCRIPT_FILENAME $document_root/robots.php;
    fastcgi_param SCRIPT_NAME /robots.php;
}

location = /sitemap.xml {
    include fastcgi_params;
    fastcgi_pass php;
    fastcgi_param SCRIPT_FILENAME $document_root/sitemap.php;
    fastcgi_param SCRIPT_NAME /sitemap.php;
}
