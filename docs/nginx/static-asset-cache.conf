# PayCal static asset cache headers (nginx)
#
# Apply on production/mac hosts in the server {} or location blocks.
# Pair with docs/nginx/compression.conf for gzip on HTML/CSS/JS (Lighthouse perf).
# PHP already sets no-store for user-specific CSS/JS bundles and HTML pages.
# These locations cover fingerprinted static files only.
#
# Deploy (mac / production):
#   1. sudo cp docs/nginx/static-asset-cache.conf /etc/nginx/snippets/paycal-static-asset-cache.conf
#   2. Add inside the paycal server {} block (after root/try_files, before PHP):
#        include snippets/paycal-static-asset-cache.conf;
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. Verify fonts (90d, not default 1d):
#        curl -sI 'https://mac.paycal.app/fonts/open-dyslexic-400.woff2?v=1.059.009' | grep -i cache-control
#      Expected: Cache-Control: public, max-age=7776000, immutable
#   5. Verify static .js (1h when versioned):
#        curl -sI 'https://mac.paycal.app/js/vendor/tweetnacl.js?v=1.059.009' | grep -i cache-control
#      Expected: Cache-Control: public, max-age=3600
#   6. PHP JS bundles (/js/, /js/business/, etc.) must stay no-store from PHP — Lighthouse
#      may still list them as "None"; that is correct for user-specific bundles.
#
# Native macOS (Homebrew nginx):
#   ./scripts/native-nginx-install-snippets.sh
#   # or manually:
#   cp docs/nginx/static-asset-cache.conf /opt/homebrew/etc/nginx/snippets/paycal-static-asset-cache.conf
#   # add inside paycal server {}: include snippets/paycal-static-asset-cache.conf;
#   nginx -t && nginx -s reload
#
# Production (Debian/Ubuntu):
#   sudo cp docs/nginx/static-asset-cache.conf /etc/nginx/snippets/paycal-static-asset-cache.conf
#   # add inside paycal server {}: include snippets/paycal-static-asset-cache.conf;
#   sudo nginx -t && sudo systemctl reload nginx

# Versioned fonts (e.g. /fonts/open-dyslexic-400.woff2?v=1.059.009)
location ~* ^/fonts/.+\.(ttf|woff2?|eot|svg)$ {
    if ($arg_v = "") {
        add_header Cache-Control "no-store" always;
        break;
    }
    expires 90d;
    add_header Cache-Control "public, max-age=7776000, immutable" always;
    try_files $uri =404;
}

# Versioned images (e.g. /img/paycal-shield.png?v=1.059.009)
location ~* ^/img/.+\.(png|jpe?g|gif|webp|svg|ico)$ {
    if ($arg_v = "") {
        add_header Cache-Control "no-store" always;
        break;
    }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Static JavaScript files with deploy version query (not PHP-backed bundles)
location ~* ^/js/.+\.js$ {
    if ($arg_v = "") {
        add_header Cache-Control "no-store" always;
        break;
    }
    expires 1h;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
}

# Notes:
# - Fonts: 90 days (7776000s, expires 90d). Safe with ?v=APP_VERSION busting on deploy.
# - Images: 1 year (31536000s) with ?v= deploy version.
# - Static .js files (e.g. /js/vendor/tweetnacl.js?v=…): 1 hour (3600s, expires 1h).
#   Versioned URLs still use ?v=APP_VERSION for deploy busting; TTL is short so fixes
#   propagate within an hour without a version bump.
# - Do NOT apply these rules to /js/*/index.php PHP module endpoints; those embed
#   per-user i18n/preferences/session salt and must remain no-store (nginx does not
#   match .php; PHP bundles must not call HttpCache::sendPublicVersionedImmutable).
# - css/common/index.php is user-preference aware (Vary: Cookie, no-store).
# - tax-rate-manifest.php sets private ETag caching in PHP.
