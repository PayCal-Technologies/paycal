# PayCal native macOS Homebrew nginx site config (reference template).
#
# Live file: /opt/homebrew/etc/nginx/servers/paycal.conf
# Install snippets: ./scripts/native-nginx-install-snippets.sh
#
# Replace PAYCAL_REPO_ROOT with your checkout path before copying, e.g.:
#   /private/var/www/paycal-technologies/paycal-private

upstream php {
    server 127.0.0.1:9000;
}

server {
    listen 80;
    server_name dev.paycal.local mac.paycal.app localhost 127.0.0.1;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), microphone=(), geolocation=(), usb=(), unload=()" always;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dev.paycal.local mac.paycal.app localhost 127.0.0.1;

    ssl_certificate PAYCAL_REPO_ROOT/docker/certs/dev.paycal.local+2.pem;
    ssl_certificate_key PAYCAL_REPO_ROOT/docker/certs/dev.paycal.local+2-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), microphone=(), geolocation=(), usb=(), unload=()" always;

    root PAYCAL_REPO_ROOT/html;
    index index.php index.html;

    client_max_body_size 1m;

    access_log /opt/homebrew/var/log/nginx/access.log;
    error_log /opt/homebrew/var/log/nginx/error.log warn;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    location = /api/index.php {
        include fastcgi_params;
        fastcgi_pass php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    location = /ws {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    location ^~ /ws/ {
        include fastcgi_params;
        fastcgi_pass php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/ws/index.php;
        fastcgi_param SCRIPT_NAME /ws/index.php;
        fastcgi_param PATH_INFO "";
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    # paycal-static-asset-cache
    include snippets/paycal-static-asset-cache.conf;

    # paycal-seo-endpoints (robots.txt, sitemap.xml)
    include snippets/paycal-seo-endpoints.conf;

    # paycal-compression
    include snippets/paycal-compression.conf;

    location ~ ^/api/(?!index\.php$) {
        rewrite ^/api/(.*)$ /api/index.php last;
    }

    location = /blog {
        return 301 /blog/;
    }

    location /blog/ {
        try_files $uri $uri/ /blog/index.php?$query_string;
    }

    location / {
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php last;
        }
    }

    location ~ /\. {
        deny all;
    }

    location ~ ^/(logs|keys|vendor|data)/ {
        deny all;
    }
}
